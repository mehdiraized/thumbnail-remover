name: Auto Release From Version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin version
        id: meta
        run: |
          plugin_version="$(sed -n "s/^Version: //p" thumbnail-remover.php | head -n 1 | tr -d '\r')"
          stable_tag="$(sed -n "s/^Stable tag: //p" readme.txt | head -n 1 | tr -d '\r')"

          if [ -z "$plugin_version" ]; then
            echo "::error::Could not resolve plugin version from thumbnail-remover.php."
            exit 1
          fi

          if [ -z "$stable_tag" ]; then
            echo "::error::Could not resolve Stable tag from readme.txt."
            exit 1
          fi

          if [ "$plugin_version" != "$stable_tag" ]; then
            echo "::error::Version mismatch: thumbnail-remover.php=$plugin_version, readme.txt=$stable_tag"
            exit 1
          fi

          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$plugin_version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Stop when current version is already released
        if: steps.existing.outputs.exists == 'true'
        run: |
          echo "Release ${{ steps.meta.outputs.tag }} already exists. Skipping."

      - name: Create and push version tag
        if: steps.existing.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Build plugin zip
        if: steps.existing.outputs.exists != 'true'
        run: |
          mkdir -p build/thumbnail-remover
          rsync -av ./ build/thumbnail-remover/ --exclude-from=.distignore
          cd build
          zip -r thumbnail-remover.zip thumbnail-remover

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: build/thumbnail-remover.zip
          overwrite_files: true
