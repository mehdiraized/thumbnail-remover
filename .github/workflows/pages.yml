name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - assets/screenshots/**
      - .github/workflows/pages.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ENABLEMENT_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Pages configuration
        id: pages_check
        if: ${{ env.PAGES_ENABLEMENT_TOKEN == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status_code="$(
            curl -sS -o /tmp/pages-response.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pages"
          )"

          if [ "${status_code}" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${status_code}" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository yet, so deployment will be skipped."
            echo "::notice::Enable GitHub Pages in Settings > Pages and set the source to GitHub Actions, or add a PAT secret named PAGES_ENABLEMENT_TOKEN to let this workflow enable it automatically."
            exit 0
          fi

          cat /tmp/pages-response.json
          echo "::error::Unexpected response while checking GitHub Pages configuration (HTTP ${status_code})."
          exit 1

      - name: Prepare Pages content
        run: |
          mkdir -p public/screenshots
          cp -R docs/. public/
          cp assets/screenshots/screenshot-1.png public/screenshots/screenshot-1.png
          cp assets/screenshots/screenshot-2.png public/screenshots/screenshot-2.png
          cp assets/screenshots/screenshot-3.png public/screenshots/screenshot-3.png
          cp assets/screenshots/screenshot-4.png public/screenshots/screenshot-4.png

      - name: Explain missing Pages configuration
        if: ${{ env.PAGES_ENABLEMENT_TOKEN == '' && steps.pages_check.outputs.enabled != 'true' }}
        run: |
          echo "::notice::Skipping deploy because GitHub Pages is not enabled for this repository."
          echo "::notice::Enable GitHub Pages in Settings > Pages and set the build source to GitHub Actions, or add a PAT secret named PAGES_ENABLEMENT_TOKEN with Pages admin access for this repository."

      - name: Setup Pages with automatic enablement
        if: ${{ env.PAGES_ENABLEMENT_TOKEN != '' }}
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ env.PAGES_ENABLEMENT_TOKEN }}

      - name: Setup Pages
        if: ${{ env.PAGES_ENABLEMENT_TOKEN == '' && steps.pages_check.outputs.enabled == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ env.PAGES_ENABLEMENT_TOKEN != '' || steps.pages_check.outputs.enabled == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ env.PAGES_ENABLEMENT_TOKEN != '' || steps.pages_check.outputs.enabled == 'true' }}
        uses: actions/deploy-pages@v4
