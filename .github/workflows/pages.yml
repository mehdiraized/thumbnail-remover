name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - assets/screenshots/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ENABLEMENT_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p public/screenshots
          cp -R docs/. public/
          cp assets/screenshots/screenshot-1.png public/screenshots/screenshot-1.png
          cp assets/screenshots/screenshot-2.png public/screenshots/screenshot-2.png
          cp assets/screenshots/screenshot-3.png public/screenshots/screenshot-3.png
          cp assets/screenshots/screenshot-4.png public/screenshots/screenshot-4.png

      - name: Explain missing Pages configuration
        if: ${{ env.PAGES_ENABLEMENT_TOKEN == '' }}
        run: |
          echo "::notice::If the next step fails with 'Get Pages site failed', enable GitHub Pages in Settings > Pages and set the build source to GitHub Actions."
          echo "::notice::If you want this workflow to auto-enable Pages, add a PAT secret named PAGES_ENABLEMENT_TOKEN with Pages admin access for this repository."

      - name: Setup Pages with automatic enablement
        if: ${{ env.PAGES_ENABLEMENT_TOKEN != '' }}
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ env.PAGES_ENABLEMENT_TOKEN }}

      - name: Setup Pages
        if: ${{ env.PAGES_ENABLEMENT_TOKEN == '' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
