name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - assets/screenshots/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p public/screenshots
          cp -R docs/. public/
          cp assets/screenshots/screenshot-1.png public/screenshots/screenshot-1.png
          cp assets/screenshots/screenshot-2.png public/screenshots/screenshot-2.png
          cp assets/screenshots/screenshot-3.png public/screenshots/screenshot-3.png
          cp assets/screenshots/screenshot-4.png public/screenshots/screenshot-4.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
