name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to publish, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref }}

      - name: Resolve release tag
        id: meta
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin zip
        run: |
          mkdir -p build/thumbnail-remover
          rsync -av ./ build/thumbnail-remover/ --exclude-from=.distignore
          cd build
          zip -r thumbnail-remover.zip thumbnail-remover

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          generate_release_notes: true
          files: build/thumbnail-remover.zip
          overwrite_files: true
